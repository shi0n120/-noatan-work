<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#120507">
<title>のあたんとおしごと。</title>

<style>
*{box-sizing:border-box}
:root{
  --bg:#0d0305;
  --panel:#1a090c;
  --panel2:#260d12;
  --red:#d7354f;
  --red2:#ff6375;
  --gold:#e7b55c;
  --cream:#fff0d5;
  --muted:#c7aa9d;
}
body{
  margin:0;
  background:
    radial-gradient(circle at 50% 12%,#48101b 0,#1a070b 28%,#090203 65%);
  color:var(--cream);
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif;
}
.app{
  max-width:430px;
  min-height:100vh;
  margin:auto;
  padding:24px 14px 105px;
}
.header{text-align:center}
h1{
  margin:5px 0 2px;
  font-size:30px;
  color:#ffd48a;
  text-shadow:0 0 15px #b42639;
}
.subtitle{
  color:#f09a9f;
  font-size:13px;
  margin-bottom:3px;
}

/* のあたん */
.noatan-wrap{
  height:330px;
  position:relative;
  display:flex;
  justify-content:center;
  align-items:flex-end;
  overflow:hidden;
}
.noatan{
  width:310px;
  max-height:325px;
  object-fit:contain;
  filter:drop-shadow(0 0 16px rgba(235,45,70,.38));
  animation:piko 3s ease-in-out infinite;
  position:relative;
  z-index:2;
}
@keyframes piko{
  0%,100%{transform:translateY(0)}
  50%{transform:translateY(-5px)}
}
.heart{
  position:absolute;
  color:#ff6173;
  font-size:25px;
  animation:heart 2.4s ease-out forwards;
  z-index:3;
  pointer-events:none;
}
@keyframes heart{
  0%{opacity:0;transform:translateY(15px) scale(.5)}
  20%{opacity:1}
  100%{opacity:0;transform:translateY(-120px) scale(1.5) rotate(15deg)}
}

/* 今日 */
.today-box{
  background:linear-gradient(145deg,rgba(51,18,21,.95),rgba(20,7,9,.96));
  border:1px solid #8b5532;
  border-radius:22px;
  padding:15px;
  text-align:center;
  box-shadow:inset 0 0 20px rgba(208,78,58,.08);
}
.date{
  font-size:18px;
  color:#e9bb77;
  font-weight:700;
}
.question{
  margin-top:9px;
  font-size:15px;
}
.choices{
  display:grid;
  grid-template-columns:1fr 1fr 1fr;
  gap:8px;
  margin-top:12px;
}
.choice{
  min-height:145px;
  border-radius:18px;
  border:1px solid #81543b;
  background:linear-gradient(#361116,#18080a);
  color:var(--cream);
  padding:12px 4px;
  font-weight:700;
  position:relative;
  transition:.18s;
}
.choice .icon{font-size:27px}
.choice .label{
  font-size:16px;
  margin-top:7px;
}
.choice .hours{
  font-size:31px;
  color:#ffd17d;
  margin:3px 0;
}
.choice small{
  font-size:11px;
  color:#d7ae8c;
}
.choice.selected{
  border:2px solid #ffcf70;
  background:linear-gradient(145deg,#8d1728,#3b0b12);
  box-shadow:0 0 20px rgba(255,77,91,.55),inset 0 0 18px rgba(255,195,96,.15);
  transform:translateY(-2px);
}

/* 出退勤 */
.work-actions{
  margin:14px 0;
  text-align:center;
}
.action{
  width:100%;
  border:0;
  border-radius:18px;
  padding:16px;
  color:white;
  font-size:18px;
  font-weight:800;
  background:linear-gradient(135deg,#b71835,#ed5265);
  box-shadow:0 5px 20px rgba(220,30,60,.25);
}
.action:active{transform:scale(.98)}
#finishBtn{display:none;background:linear-gradient(135deg,#5b3038,#8d4552)}
.timer{
  display:none;
  font-size:36px;
  font-weight:800;
  color:#ffd178;
  margin:10px;
  font-variant-numeric:tabular-nums;
}
.work-message{
  font-size:14px;
  color:#ffc1c7;
  min-height:23px;
}

/* 月間 */
.month{
  margin-top:15px;
  border:1px solid #86563b;
  border-radius:22px;
  background:linear-gradient(145deg,#200a0e,#100507);
  padding:17px 14px;
}
.month h2{
  text-align:center;
  font-size:21px;
  color:#efbd72;
  margin:0 0 16px;
}
.stats{
  display:grid;
  grid-template-columns:1fr 1fr 1fr;
  text-align:center;
  gap:4px;
}
.stat .emoji{font-size:22px}
.stat strong{
  display:block;
  font-size:22px;
  color:#ffd17b;
  margin:3px 0;
}
.stat small{
  color:#c9a691;
  font-size:10px;
}
.progress{
  height:12px;
  background:#160609;
  border:1px solid #674235;
  border-radius:10px;
  overflow:hidden;
  margin:18px 0 5px;
}
.bar{
  height:100%;
  width:0;
  background:linear-gradient(90deg,#d92d4c,#ff6374);
  transition:.5s;
}
.progress-label{
  text-align:right;
  font-size:12px;
  color:#e3b79c;
}
.cheer{
  margin-top:14px;
  border:1px solid #674235;
  border-radius:10px;
  padding:10px;
  text-align:center;
  color:#f5b7b9;
  font-size:12px;
}

/* 下ナビ */
.nav{
  position:fixed;
  bottom:0;
  left:50%;
  transform:translateX(-50%);
  width:100%;
  max-width:430px;
  height:82px;
  display:grid;
  grid-template-columns:repeat(4,1fr);
  background:rgba(17,5,7,.97);
  border-top:1px solid #75432f;
  padding-bottom:env(safe-area-inset-bottom);
  z-index:20;
}
.nav button{
  background:none;
  border:0;
  color:#b88f77;
  font-size:11px;
}
.nav button span{
  display:block;
  font-size:25px;
  margin-bottom:3px;
}
.nav .active{
  color:#fff0c7;
  text-shadow:0 0 10px #ff3655;
}
</style>
</head>

<body>
<div class="app">

<header class="header">
  <h1>のあたんとおしごと。</h1>
  <div class="subtitle">きょうもいっしょに、えらいのあたん♪</div>
</header>

<div class="noatan-wrap" id="noatanWrap">
  <img
    class="noatan"
    src="AF24F85F-2C49-442D-A387-182B2706458C.png"
    alt="のあたん">
</div>

<section class="today-box">
  <div class="date" id="date"></div>
  <div class="question">きょうはどこまでおしごとしますかぁ？💕</div>

  <div class="choices">
    <button class="choice" data-type="morning" onclick="selectPlan('morning')">
      <div class="icon">☀️</div>
      <div class="label">午前まで</div>
      <div class="hours">2h</div>
      <small>〜12:00まで</small>
    </button>

    <button class="choice" data-type="full" onclick="selectPlan('full')">
      <div class="icon">🌅</div>
      <div class="label">午後まで</div>
      <div class="hours">4h</div>
      <small>〜15:00まで</small>
    </button>

    <button class="choice" data-type="off" onclick="selectPlan('off')">
      <div class="icon">🌙</div>
      <div class="label">きょうは</div>
      <div class="hours" style="font-size:18px">おやすみ</div>
      <small>すやすや…♡</small>
    </button>
  </div>
</section>

<div class="work-actions">
  <div class="timer" id="timer">00:00:00</div>
  <div class="work-message" id="workMessage">勤務予定をえらんでねぇ♡</div>

  <button class="action" id="startBtn" onclick="startWork()">
    ♡ 出勤する ♡
  </button>

  <button class="action" id="finishBtn" onclick="finishWork()">
    ♡ 退勤する ♡
  </button>
</div>

<section class="month">
  <h2>🌸 9月のおしごと 🌸</h2>

  <div class="stats">
    <div class="stat">
      <div class="emoji">🕒</div>
      <strong id="monthHours">0時間</strong>
      <small>/ 目標 80時間</small>
    </div>

    <div class="stat">
      <div class="emoji">📅</div>
      <strong id="monthDays">0日</strong>
      <small>/ 目標 20日</small>
    </div>

    <div class="stat">
      <div class="emoji">💰</div>
      <strong id="salary">¥0</strong>
      <small>お給料みこみ</small>
    </div>
  </div>

  <div class="progress">
    <div class="bar" id="bar"></div>
  </div>
  <div class="progress-label" id="percent">0%</div>

  <div class="cheer" id="cheer">
    💕 のあたん、いっしょにがんばるのですぅ〜💕
  </div>
</section>

</div>

<nav class="nav">
  <button class="active"><span>⌂</span>きょう</button>
  <button><span>▣</span>きろく</button>
  <button><span>💰</span>おきゅうりょう</button>
  <button><span>⚙️</span>せってい</button>
</nav>

<script>
const HOURLY_WAGE = 1250;
const MONTH_GOAL_HOURS = 80;

let plan = localStorage.getItem("todayPlan");
let startedAt = Number(localStorage.getItem("startedAt")) || null;
let timerLoop = null;
let heartLoop = null;

function renderDate(){
  const d = new Date();
  const days = ["日","月","火","水","木","金","土"];
  date.textContent =
    `📅 きょうは ${d.getMonth()+1}月${d.getDate()}日（${days[d.getDay()]}）`;
}

function selectPlan(type){
  plan = type;
  localStorage.setItem("todayPlan",type);

  document.querySelectorAll(".choice").forEach(x=>{
    x.classList.toggle("selected",x.dataset.type===type);
  });

  if(type==="off"){
    workMessage.textContent="きょうはゆっくりおやすみしよぉ♡";
    startBtn.style.display="none";
  }else{
    workMessage.textContent =
      type==="morning"
      ? "12時まで、のあたんとがんばろぉ♡"
      : "15時まで、いっしょにがんばろぉ♡";
    if(!startedAt) startBtn.style.display="block";
  }
}

function startWork(){
  if(!plan || plan==="off"){
    workMessage.textContent="先に勤務予定をえらんでねぇ♡";
    return;
  }

  startedAt=Date.now();
  localStorage.setItem("startedAt",startedAt);

  startBtn.style.display="none";
  finishBtn.style.display="block";
  timer.style.display="block";

  workMessage.textContent="おしごと開始〜♡ しおんえらいっ";

  updateTimer();
  timerLoop=setInterval(updateTimer,1000);
  heartLoop=setInterval(makeHeart,1100);

  for(let i=0;i<8;i++) setTimeout(makeHeart,i*130);
}

function updateTimer(){
  if(!startedAt)return;

  const diff=Date.now()-startedAt;
  const h=Math.floor(diff/3600000);
  const m=Math.floor((diff%3600000)/60000);
  const s=Math.floor((diff%60000)/1000);

  timer.textContent=
    String(h).padStart(2,"0")+":"+
    String(m).padStart(2,"0")+":"+
    String(s).padStart(2,"0");
}

function finishWork(){
  const diff=Date.now()-startedAt;
  const hours=diff/3600000;

  let total=Number(localStorage.getItem("monthHours"))||0;
  let days=Number(localStorage.getItem("monthDays"))||0;

  total+=hours;
  days+=1;

  localStorage.setItem("monthHours",total);
  localStorage.setItem("monthDays",days);

  localStorage.removeItem("startedAt");
  startedAt=null;

  clearInterval(timerLoop);
  clearInterval(heartLoop);

  finishBtn.style.display="none";
  timer.style.display="none";

  workMessage.textContent="おしごとおしまいっ♡ 今日もがんばったねぇ";

  for(let i=0;i<16;i++)setTimeout(makeHeart,i*90);

  renderStats();
}

function makeHeart(){
  const h=document.createElement("div");
  h.className="heart";
  h.textContent=["♡","♥","💕","❤"][Math.floor(Math.random()*4)];
  h.style.left=(15+Math.random()*70)+"%";
  h.style.top=(40+Math.random()*45)+"%";
  noatanWrap.appendChild(h);
  setTimeout(()=>h.remove(),2400);
}

function renderStats(){
  const h=Number(localStorage.getItem("monthHours"))||0;
  const d=Number(localStorage.getItem("monthDays"))||0;

  monthHours.textContent=h.toFixed(1)+"時間";
  monthDays.textContent=d+"日";
  salary.textContent="¥"+Math.round(h*HOURLY_WAGE).toLocaleString();

  const p=Math.min(100,(h/MONTH_GOAL_HOURS)*100);
  bar.style.width=p+"%";
  percent.textContent=Math.round(p)+"%";
}

function restore(){
  renderDate();
  renderStats();

  if(plan) selectPlan(plan);

  if(startedAt){
    startBtn.style.display="none";
    finishBtn.style.display="block";
    timer.style.display="block";
    workMessage.textContent="おしごと中だよぉ♡";
    updateTimer();
    timerLoop=setInterval(updateTimer,1000);
    heartLoop=setInterval(makeHeart,1100);
  }
}

restore();
</script>
</body>
</html>
